name: school-project-local

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school
      POSTGRES_PASSWORD: local-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - school_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://school:local-only@db:5432/school
      VIDEO_STORAGE_DIR: /srv/data/videos
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - school_video:/srv/data/videos
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://school:local-only@db:5432/school
    depends_on:
      db:
        condition: service_healthy
volumes:
  school_pg:
  school_video:
