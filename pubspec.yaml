name: school_website
description: Springfield International Academy -- A production-grade school website built with Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0+2
  fl_chart: ^0.68.0
  web_socket_channel: ^3.0.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/gallery/
    - assets/images/gallery/campus/
    - assets/images/gallery/events/
    - assets/images/gallery/sports/
    - assets/images/gallery/labs/
    - assets/images/gallery/classroom/
    - assets/images/events/
    - assets/images/about/
    - assets/data/
