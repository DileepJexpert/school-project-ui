name: school_website
description: Springfield International Academy -- A production-grade school website built with Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  dio: ^5.4.3+1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/images/gallery/
    - assets/images/gallery/campus/
    - assets/images/gallery/events/
    - assets/images/gallery/sports/
    - assets/images/gallery/labs/
    - assets/images/gallery/classroom/
    - assets/images/events/
    - assets/images/about/
    - assets/data/
