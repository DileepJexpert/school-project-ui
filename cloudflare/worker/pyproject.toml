[project]
name = "school-api-worker"
version = "0.1.0"
description = "School Management Cloudflare API Worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=1.10.18,<2.0.0",
    "python-multipart>=0.0.9",
    "starlette>=0.38.0",
    "typing-extensions>=4.12.0",
    "anyio>=4.0.0",
    "workers-runtime-sdk>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
